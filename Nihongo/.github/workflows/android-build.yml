name: Build NIHONGO Debug & Release APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Run Unit Test Suite
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Assemble Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload Installable Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Nihongo-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Installable Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Nihongo-Release-APK
          path: app/build/outputs/apk/release/*.apk
